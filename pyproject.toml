[project]
name = "linkedin-ai-agent"
version = "0.1.0"
description = "AI agent for LinkedIn content automation"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pydantic",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"
