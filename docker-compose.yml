services:
  linkedin-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: linkedin-ai-agent:latest
    container_name: linkedin-mcp-server
    env_file:
      - .env
    restart: unless-stopped
    # Los flujos HITL requieren un navegador visible en el host.
    # Este servicio empaqueta el servidor para validación de entorno y CI.
    # Ejecutar localmente con `python run_test_flow.py` para el flujo HITL completo.
    stdin_open: true
    tty: true
